<title>02 Ingérer un document</title>
<style>
.ml{color:#8A8782}
.doc{position:absolute;top:-150px;width:300px;height:250px;border-radius:20px;background:#F4F2EE}
.sk{position:absolute;left:28px;height:10px;border-radius:5px;background:#D9D5CE}
.lbl{position:absolute;left:0;top:266px;width:300px;text-align:center;font-size:24px;font-family:'Geist Mono',monospace}
</style>
<div data-slot="shape">
  <div class="L" id="Lchat">
    <div class="row" style="left:-440px;top:-102px;gap:14px;font-size:30px;font-weight:600;letter-spacing:-.01em"><span id="icSp"></span>Claude<span class="ml" style="font-size:24px;font-weight:400;letter-spacing:0">· Marina Memory connectée</span></div>
    <div class="a" style="left:-440px;top:-30px;width:880px;height:96px;border-radius:48px;border:1.5px solid #E2DFD9;box-sizing:border-box"></div>
    <div class="a mono" style="left:-404px;top:-1px;font-size:28px;line-height:38px;white-space:nowrap"><span id="typed"></span><span id="caret" style="display:inline-block;width:3px;height:30px;background:#0B0B0B;vertical-align:-6px;margin-left:2px"></span></div>
    <div class="a" id="send" style="left:358px;top:-17px;width:70px;height:70px;border-radius:35px;background:#0B0B0B;display:flex;align-items:center;justify-content:center"><span id="icUp" style="display:block;transform:rotate(-90deg)"></span></div>
  </div>
  <div class="L" id="Lconv">
    <div class="a" style="left:-500px;top:-222px;font-size:32px;font-weight:600;letter-spacing:-.01em;white-space:nowrap">Converti une fois, en local</div>
    <div class="doc" style="left:-500px"><div id="pdfL"></div><div class="lbl">chapitre3.pdf</div></div>
    <div class="a" id="arw" style="left:-28px;top:-53px"></div>
    <div class="doc" style="left:200px"><div class="a" id="mdH" style="left:28px;top:30px;height:16px;border-radius:8px;background:#FF5A1F"></div><div id="mdL"></div><div class="lbl">chapitre3.md</div></div>
    <div class="a" id="gain" style="left:220px;top:166px;width:260px;height:48px;line-height:48px;text-align:center;border-radius:24px;background:#0B0B0B;color:#fff;font-size:22px;font-weight:600">90–95 % plus léger</div>
  </div>
  <div class="L" id="Ldone"><div class="row" style="transform:translate(-50%,-50%);gap:18px;color:#fff;font-size:38px;font-weight:600;letter-spacing:-.01em"><span id="ok" style="width:48px;height:48px;border-radius:24px;background:#FF5A1F;display:flex;align-items:center;justify-content:center"></span>Rangé dans sources/<span class="mono" style="font-size:24px;font-weight:500;letter-spacing:0;color:#9A9791">relu par sections, jamais recollé</span></div></div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
$('icSp').innerHTML=M.icon('sparkle',32,'#FF5A1F'); $('icUp').innerHTML=M.icon('arrow',30,'#fff',2.6);
$('arw').innerHTML=M.icon('arrow',56,'#0B0B0B'); $('ok').innerHTML=M.icon('check',28,'#fff',3);
const PW=[244,200,230,170,244,210,236,190,244,160,220];
$('pdfL').innerHTML=PW.map((w,i)=>`<div class="sk" style="top:${24+i*19}px;width:${w}px"></div>`).join('');
const MW=[230,190,240,150,210];
$('mdL').innerHTML=MW.map((w,i)=>`<div class="sk" id="m${i}" style="top:${72+i*30}px"></div>`).join('');
const TXT='ingère ~/Downloads/chapitre3.pdf', TY0=0.5, TY1=1.9;
const sendP=M.track(0,[[2.38,1,[45,1]],[2.48,0,[22,.72]]]);
const gain=M.track(0,[[4.7,1,[16,0.75]]]);
M.scene({W:1920,H:1080,bg:'#E9E7E2',T:8.5,intro:0.12,
  SH:{chat:{w:1000,h:300,r:40,bg:'#FFFFFF',cam:1.3},conv:{w:1100,h:500,r:36,bg:'#FFFFFF',cam:1.25},done:{w:1010,h:124,r:62,bg:'#0B0B0B',cam:1.5}},
  start:'chat',SEQ:[[2.75,'conv'],[6.1,'done']],
  layers:[
    {el:'Lchat',tin:0.12,tout:2.75,o:{din:0.05},update:t=>{
      const n=Math.round(M.clamp((t-TY0)/(TY1-TY0))*TXT.length); M.setText($('typed'),TXT.slice(0,n));
      const typing=t>TY0-0.05&&t<TY1+0.05; $('caret').style.opacity=((typing||Math.floor(t*2.4)%2==0)&&t<2.45)?1:0;
      $('send').style.transform=`scale(${(1-0.12*sendP(t)).toFixed(4)})`;}},
    {el:'Lconv',tin:2.75,tout:6.1,update:t=>{
      const a=M.vis(t,3.15,null,{din:0,lin:0.25}); $('arw').style.opacity=a.o; $('arw').style.transform=`translateX(${(1-a.a)*-24}px)`;
      $('mdH').style.width=(150*M.eio((t-3.45)/0.35))+'px';
      MW.forEach((w,i)=>$('m'+i).style.width=(w*M.eio((t-3.6-0.12*i)/0.35))+'px');
      const g=gain(t); $('gain').style.transform=`scale(${Math.max(0,g).toFixed(4)})`; $('gain').style.opacity=M.clamp(g*1.5);}},
    {el:'Ldone',tin:6.1,tout:null,o:{din:0.05}},
  ],
  cursor:{size:44,clicks:[2.45],keys:[[0,560,230],[1.5,560,230],[2.25,393,22],[2.65,393,22],[3.4,560,300]]},
});
</script>
