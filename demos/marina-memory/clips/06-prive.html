<script>
const $=id=>document.getElementById(id);
M.IC.lock=['M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2Z','M7 11V7a5 5 0 0 1 10 0v4'];
$('icL').innerHTML=M.icon('lock',40,'#FF5A1F');
[0,1,2].forEach(i=>$('p'+i).querySelector('i').innerHTML=M.icon('check',24,'#fff',3));
const PT=[1.95,2.55,3.15];
const fade=(el,v,dy=0)=>{const s=el.style;s.opacity=v.o;s.filter=v.blur>0.05?`blur(${v.blur}px)`:'none';s.transform=`translateY(${dy}px)`;};
const dot=PT.map(p=>M.track(0,[[p+0.12,1,[18,0.7]]]));
M.scene({W:1920,H:1080,bg:'#E9E7E2',T:7,intro:0.12,
  SH:{pill:{w:640,h:124,r:62,bg:'#0B0B0B',cam:1.8},card:{w:1000,h:480,r:40,bg:'#FFFFFF',cam:1.3}},
  start:'pill',SEQ:[[1.4,'card']],
  layers:[
    {el:'Lpill',tin:0.12,tout:1.4,o:{din:0.05}},
    {el:'Lcard',tin:1.4,tout:null,anchor:'t',update:t=>{
      PT.forEach((p,i)=>{const v=M.vis(t,p,null,{din:0,lin:0.22}); fade($('p'+i),v,(1-v.a)*12); const d=dot[i](t); const ic=$('p'+i).querySelector('i').style; ic.background=`rgb(${Math.round(11+(255-11)*M.clamp(d))},${Math.round(11+(90-11)*M.clamp(d))},${Math.round(11+(31-11)*M.clamp(d))})`; ic.transform=`scale(${(1+0.12*Math.sin(Math.PI*M.clamp((t-p-0.12)/0.3))).toFixed(4)})`;});
      fade($('foot'),M.vis(t,4.4,null,{din:0,lin:0.28}));
    }},
  ]});
</script>
