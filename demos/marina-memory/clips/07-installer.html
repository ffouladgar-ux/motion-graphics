<title>07 Installer</title>
<style>
.ml{color:#8A8782}
.ln{position:absolute;left:-500px;font-family:'Geist Mono',monospace;font-size:26px;line-height:40px;white-space:nowrap}
.cr{display:inline-block;width:12px;height:28px;background:#0B0B0B;vertical-align:-5px;margin-left:2px}
</style>
<div data-slot="shape">
  <div class="L" id="Lterm">
    <div class="a" style="left:-516px;top:22px;display:flex;gap:10px"><i style="width:14px;height:14px;border-radius:50%;background:#D6D3CE"></i><i style="width:14px;height:14px;border-radius:50%;background:#D6D3CE"></i><i style="width:14px;height:14px;border-radius:50%;background:#D6D3CE"></i></div>
    <div class="a mono ml" style="left:-200px;top:17px;width:400px;text-align:center;font-size:19px">marina-memory — zsh</div>
    <div class="a" style="left:-550px;top:58px;width:1100px;height:1.5px;background:#E2DFD9"></div>
    <div class="ln" id="l0" style="top:88px"><span class="ml">$ </span><span class="tp"></span><span class="cr"></span></div>
    <div class="ln" id="l1" style="top:140px"><span class="ml">$ </span><span class="tp"></span><span class="cr"></span></div>
    <div class="ln" id="l2" style="top:192px"><span id="inst"><span class="ml">installation </span><span style="display:inline-block;width:360px;height:12px;border-radius:6px;background:#E2DFD9;vertical-align:2px;position:relative"><span id="fill" style="position:absolute;left:0;top:0;height:12px;border-radius:6px;background:#0B0B0B"></span></span></span><span id="instd" style="position:absolute;left:0;top:0"><span style="color:#FF5A1F">✓</span> coffre créé · Claude connecté</span></div>
    <div class="ln" id="l3" style="top:244px"><span class="ml">$ </span><span class="tp"></span><span class="cr"></span></div>
    <div class="ln" id="l4" style="top:296px">RESULT: <span id="ready" style="display:inline-block;background:#FF5A1F;color:#fff;border-radius:8px;padding:0 12px;font-weight:500">ready</span></div>
    <div class="a ml" id="hint" style="left:-500px;top:396px;font-size:24px;white-space:nowrap">Sans terminal : double-cliquez sur « Install Marina Memory ».</div>
  </div>
  <div class="L" id="Lend"><div class="row" style="transform:translate(-50%,-50%);gap:18px;color:#fff;font-size:46px;font-weight:600;letter-spacing:-.02em"><span id="icSp"></span>Marina Memory<span class="mono" style="font-size:24px;font-weight:500;letter-spacing:0;color:#9A9791;margin-left:8px">github.com/ffouladgar-ux/marina-memory</span></div></div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
$('icSp').innerHTML=M.icon('sparkle',42,'#FF5A1F');
const CMD=[['l0','git clone https://github.com/ffouladgar-ux/marina-memory',0.4,1.5],['l1','cd marina-memory && ./install.sh',1.8,2.45],['l3','mm doctor',4.85,5.2]];
const fade=(el,v,dy=0)=>{const s=el.style;s.opacity=v.o;s.filter=v.blur>0.05?`blur(${v.blur}px)`:'none';s.transform=`translateY(${dy}px)`;};
const rdy=M.track(0,[[5.65,1,[16,0.75]]]);
M.scene({W:1920,H:1080,bg:'#E9E7E2',T:10,intro:0.12,
  SH:{term:{w:1100,h:480,r:26,bg:'#FFFFFF',cam:1.25},end:{w:1220,h:130,r:65,bg:'#0B0B0B',cam:1.3}},
  start:'term',SEQ:[[7.3,'end']],
  layers:[
    {el:'Lterm',tin:0.12,tout:7.3,anchor:'t',o:{din:0.05},update:t=>{
      CMD.forEach(([id,s,a,b],k)=>{const el=$(id); el.style.display=t<a-0.25?'none':'';
        const n=Math.round(M.clamp((t-a)/(b-a))*s.length); M.setText(el.querySelector('.tp'),s.slice(0,n));
        const next=k<2?CMD[k+1][2]-0.3:99; const nextIsInst=k==1?2.6:next;
        el.querySelector('.cr').style.opacity=(t<Math.min(next,nextIsInst)&&(t<b+0.05||Math.floor(t*2.4)%2==0))?1:0;});
      const iv=M.vis(t,2.55,4.35,{din:0,lin:0.15,lout:0.12}); fade($('inst'),iv);
      $('fill').style.width=(360*M.eio((t-2.65)/1.55))+'px';
      fade($('instd'),M.vis(t,4.4,null,{din:0,lin:0.2}));
      fade($('l4'),M.vis(t,5.45,null,{din:0,lin:0.15}));
      const r=rdy(t); $('ready').style.transform=`scale(${(0.6+0.4*Math.max(0,r)).toFixed(4)})`;
      fade($('hint'),M.vis(t,6.1,null,{din:0,lin:0.25}));
    }},
    {el:'Lend',tin:7.3,tout:null,o:{din:0.05}},
  ]});
</script>
