<title>03 Proof</title>
<style>
.tt{position:absolute;left:-520px;top:52px;font-size:44px;line-height:1.1;white-space:nowrap}
.st{position:absolute;left:-520px;top:112px;font-size:23px;color:var(--n1);white-space:nowrap}
.lb{position:absolute;left:-520px;width:300px;font-size:30px;font-weight:500;white-space:nowrap}
.trk{position:absolute;left:-200px;width:720px;height:60px;border-radius:30px;background:var(--canvas)}
.fil{position:absolute;left:-200px;height:60px;border-radius:30px}
.tip{position:absolute;height:56px;border-radius:28px;background:var(--ink);color:var(--n0);display:flex;align-items:center;padding:0 24px;font-size:24px;font-weight:600;white-space:nowrap;transform-origin:100% 0}
.pv{transform:translate(-50%,-50%);gap:14px;color:var(--n0);font-size:46px;font-weight:600;letter-spacing:-.02em}
</style>
<div data-slot="shape">
  <div class="L" id="Lpill"><div class="row pv"><span id="icB"></span>The difference</div></div>
  <div class="L" id="Lch">
    <div class="tt display">Tickets resolved per agent</div>
    <div class="st">Same team · same week · illustrative</div>
    <div class="lb" style="top:212px">Before</div><div class="trk" style="top:200px"></div><div class="fil" id="fB" style="top:200px;background:var(--n1)"></div>
    <div class="lb" style="top:332px">With Tidepool</div><div class="trk" style="top:320px"></div><div class="fil" id="fW" style="top:320px;background:var(--accent)"></div>
    <div class="tip" id="tip" style="top:400px">More resolved. Same team.</div>
  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
$('icB').innerHTML=M.icon('bars',44,R.C.n0);
const [b1,b2,b3,b4,b5]=R.bs(1,2,3,4,5);
const fB=M.track(0,[[b2,0.42,[11,0.9]]]);
const wL=M.track(0,[]), wR=M.track(0,[[R.b(2.5),0.42,[11,0.9]],[b4,0.94,M.FAST]]);
M.scene({
  W:1920,H:1080,bg:R.C.canvas,T:R.T,intro:0,
  SH:{pill:{w:470,h:120,r:60,bg:R.C.ink,cam:1.9}, ch:{w:1180,h:500,r:44,bg:R.C.n0,cam:1.3}},
  start:'pill', SEQ:[[b1,'ch']],
  layers:[
    {el:'Lpill',tin:null,tout:b1},
    {el:'Lch',tin:b1,tout:null,anchor:'t',update:t=>{
      $('fB').style.width=(720*Math.max(0,fB(t)))+'px';
      const w=720*Math.max(0,wR(t)); $('fW').style.width=w+'px';
      const k=R.kick(t,[b4],0.12); $('fW').style.transform=`scaleY(${(1+0.08*k).toFixed(4)})`;
      const v=M.vis(t,b5,null,{din:0,lin:0.2}); const tp=$('tip');
      if(M.apply(tp,v,'')){tp.style.left=(-200+w-tp.offsetWidth)+'px'; tp.style.transform=`translateY(${((1-M.S(t-b5,14,0.75))*-16).toFixed(2)}px) scale(${v.s.toFixed(4)})`;}
    }},
  ],
});
</script>
